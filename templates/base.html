<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Corgijans Rezepte</title>
    <link rel="icon" type="image/ico" href="/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .avatar-container {
            display: flex;
            align-items: center;
        }

        .avatar-img-border {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            overflow: hidden;
        }

        .avatar-img {
            width: 100%;
            height: auto;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/script.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-xl navbar-dark bg-dark fixed-top">
        <a style="padding-left: 140px" href="/">
            <img src="/favicon.ico" alt="Logo" style="position:fixed; left: 10px; width:140px; height:140px;" class="d-inline-block">
            Corgijans Rezepte
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#main-navbar"
                aria-controls="main-navbar" aria-expanded="false" aria-label="Navigation umschalten">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navbar">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/e/new">Hinzufügen</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="http://blog.corgijan.dev">Blog</a>
                </li>
            </ul>
        </div>
        <div class="avatar-container ml-3">
            <div class="avatar-img-border">
                <a href="/">
                    <img alt="Navigation Avatar" class="avatar-img"
                         src="http://blog.corgijan.dev/assets/images/ava.jpg">
                </a>
            </div>
        </div>
    </nav>
    <main class="container mt-5 pt-5">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
