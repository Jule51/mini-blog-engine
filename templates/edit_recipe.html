{% extends "base.html" %}
{% block content %}
<form method="post" enctype="multipart/form-data" action="/" class="container mt-4">
    <div class="form-group">
        <label>Bild:</label><br>
        {% if has_image %}
        <img src="{{ img_url }}" class="img-fluid mb-2"><br>
        {% endif %}
        <input type="file" class="form-control-file" name="image" accept="image/webp, image/jpeg, image/png"/>
    </div>

    <div class="form-group">
        <label for="title">Titel:</label>
        <input type="text" class="form-control" id="title" name="title" value="{{r.title|e}}"/>
    </div>

    <div class="form-group">
        <label for="tags">Tags (Kommaseparierte Liste):</label>
        <input type="text" class="form-control" id="tags" name="tags" value="{{r.tags|e}}"/>
    </div>

    <div class="form-group">
        <label for="ingredients">Zutaten:</label>
        <textarea class="form-control" id="ingredients" name="ingredients" rows="5">{{r.ingredients|e}}</textarea>
    </div>

    <div class="form-group">
        <label for="prep">Zubereitung:</label>
        <textarea class="form-control" id="prep" name="prep" rows="5">{{r.prep|e}}</textarea>
    </div>

    {% if not authenticated %}
    <div class="form-group">
        <label for="pass">Passphrase:</label>
        <input type="password" class="form-control" id="pass" name="pass"/>
    </div>
    {% endif %}

    <input type="hidden" name="id" value="{{r.id|e}}"/>

    <div class="form-group del" style="display:none">
        <label for="del-title">Zum Löschen, Rezepttitel eingeben:</label>
        <input type="text" class="form-control" id="del-title" name="del-title" value=""
               onkeyup="document.getElementById('del-submit').innerHTML = document.getElementById('del-title').value!='' ? 'Löschen' : 'Abschicken'"/>
    </div>

    <div class="form-group d-flex gap-2">
        <button id="del-submit" type="submit" class="btn btn-primary">Abschicken</button>
        <button type="button" class="btn btn-danger del"
                onclick="for (let e of document.getElementsByClassName('del')) {e.style.display = e.style.display=='none' ? 'block' : 'none'}">
            Löschen
        </button>
    </div>
</form>
*all recipes are released in the public domain and can be used freely
<br>
{% endblock %}
